name: Falix Control Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (start or stop)'
        required: true
        default: 'start'

jobs:
  control-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Playwright and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium --with-deps

    - name: Run Automation Script
      env:
        FALIX_EMAIL: ${{ secrets.FALIX_EMAIL }}
        FALIX_PASSWORD: ${{ secrets.FALIX_PASSWORD }}
        SERVER_ACTION: ${{ github.event.inputs.action }}
      run: |
        python - <<EOF
        import os
        import time
        from playwright.sync_api import sync_playwright

        email = os.getenv("FALIX_EMAIL")
        password = os.getenv("FALIX_PASSWORD")
        action = os.getenv("SERVER_ACTION") # مقدارش یا start هست یا stop

        with sync_playwright() as p:
            # باز کردن مرورگر کروم در حالت مخفی
            browser = p.chromium.launch(headless=True)
            page = browser.new_page()
            
            print("🚀 در حال باز کردن صفحه لاگین فالیکس...")
            page.goto("https://client.falixnodes.net/login")
            time.sleep(3)
            
            # وارد کردن ایمیل و پسورد شما که در سکرت‌های گیت‌هاب ست کردی
            page.fill('input[type="email"]', email)
            page.fill('input[type="password"]', password)
            
            # کلیک روی دکمه ورود
            page.click('button[type="submit"]')
            time.sleep(5)
            
            print("🔗 در حال ورود به صفحه کنسول سرور ماینکرافت...")
            # رفتن مستقیم به صفحه سرور شما طبق عکسی که فرستادی
            page.goto("https://client.falixnodes.net/server/3241406/console")
            time.sleep(5)
            
            if action == "start":
                print("🟢 در حال کلیک روی دکمه START سرور...")
                # پیدا کردن دکمه استارت بر اساس متن یا ساختار پنل پتروداکتیل
                page.click('button:has-text("Start")')
            elif action == "stop":
                print("🔴 در حال کلیک روی دکمه STOP سرور...")
                page.click('button:has-text("Stop")')
                
            time.sleep(3)
            print("✅ عملیات با موفقیت انجام شد!")
            browser.close()
        EOF
