name: Falix Control Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'start'

jobs:
  control-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Automation Script
        env:
          FALIX_EMAIL: ${{ secrets.FALIX_EMAIL }}
          FALIX_PASSWORD: ${{ secrets.FALIX_PASSWORD }}
          SERVER_ACTION: ${{ github.event.inputs.action }}
        run: |
          python -c "
          import os, time
          from playwright.sync_api import sync_playwright
          email = os.getenv('FALIX_EMAIL')
          password = os.getenv('FALIX_PASSWORD')
          action = os.getenv('SERVER_ACTION')
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print('Opening Login...')
              page.goto('https://client.falixnodes.net/login')
              time.sleep(3)
              page.fill('input[type=\"email\"]', email)
              page.fill('input[type=\"password\"]', password)
              page.click('button[type=\"submit\"]')
              time.sleep(5)
              print('Going to Console...')
              page.goto('https://client.falixnodes.net/server/3241406/console')
              time.sleep(5)
              if action == 'start':
                  page.click('button:has-text(\"Start\")')
              elif action == 'stop':
                  page.click('button:has-text(\"Stop\")')
              time.sleep(3)
              print('Done!')
              browser.close()
          "
