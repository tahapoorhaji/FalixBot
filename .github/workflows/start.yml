name: Falix Control Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (start, stop, restart, logs)'
        required: true
        default: 'start'
      chat_id:
        description: 'Telegram User Chat ID'
        required: true

jobs:
  control-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run Automation Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          SERVER_ACTION: ${{ github.event.inputs.action }}
        run: |
          cat << 'EOF' > script.py
          import os
          import time
          import json
          import re
          import requests
          from playwright.sync_api import sync_playwright

          bot_token = os.getenv('BOT_TOKEN')
          sender_chat_id = str(os.getenv('CHAT_ID'))
          action = os.getenv('SERVER_ACTION')
          APP_URL = "https://نام-اپلیکیشن-شما-در-هاست.com" # آدرس دقیق هاست رندر یا کویب شما

          # 👥 لیست کل کاربران (آیدی خودت و دوستت را دقیقاً اینجا جایگزین کن)
          TOTAL_USERS = {"1975142727", "5213388626"} 

          live_msg_id = None

          def send_to_others(text):
              others = TOTAL_USERS - {sender_chat_id}
              for uid in others:
                  if uid:
                      url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
                      payload = {"chat_id": uid, "text": text, "parse_mode": "Markdown"}
                      try: requests.post(url, json=payload)
                      except: pass

          def send_or_edit_telegram(text, keyboard=None):
              global live_msg_id
              if live_msg_id is None:
                  url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
                  payload = {"chat_id": sender_chat_id, "text": text, "parse_mode": "Markdown"}
                  if keyboard: payload["reply_markup"] = json.dumps(keyboard)
                  try:
                      res = requests.post(url, json=payload).json()
                      if res.get("ok"): live_msg_id = res["result"]["message_id"]
                  except: pass
              else:
                  url = f"https://api.telegram.org/bot{bot_token}/editMessageText"
                  payload = {"chat_id": sender_chat_id, "message_id": live_msg_id, "text": text, "parse_mode": "Markdown"}
                  if keyboard: payload["reply_markup"] = json.dumps(keyboard)
                  try: requests.post(url, json=payload)
                  except: pass

          action_fa = {"start": "روشن کردن", "stop": "خاموش کردن", "restart": "ری‌استارت", "logs": "دریافت لاگ"}.get(action, action)
          send_to_others(f"📢 **اعلان پنل سرور:**\n👤 دوستت سرور را روی وضعیت **[{action_fa}]** گذاشت.\n⏳ ربات در حال حاضر مشغول است، لطفا دکمه دیگری نزنید.")

          with sync_playwright() as p:
              send_or_edit_telegram("🤖 **[مرحله ۱/۲]** در حال آماده‌سازی مرورگر ابری...")
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  viewport={"width": 1280, "height": 720}
              )
              
              if os.path.exists('cookies.json'):
                  with open('cookies.json', 'r') as f:
                      cookies = json.load(f)
                      formatted_cookies = []
                      for cookie in cookies:
                          if 'sameSite' in cookie:
                              s_site = str(cookie['sameSite']).capitalize()
                              if s_site in ['Strict', 'Lax', 'None']: cookie['sameSite'] = s_site
                              else: cookie['sameSite'] = 'None'
                          if 'id' in cookie: del cookie['id']
                          formatted_cookies.append(cookie)
                      context.add_cookies(formatted_cookies)
                  
                  page = context.new_page()
                  send_or_edit_telegram("🔗 **[مرحله ۲/۲]** ورود موفقیت‌آمیز بود. بارگذاری صفحه کنسول سرور...")
                  page.goto('https://client.falixnodes.net/server/3241406/console', wait_until="commit")
                  
                  # زمان انتظار طولانی‌تر و مطمئن برای لود کامل اسکریپت‌های فالیکس
                  time.sleep(20)
                  
                  # بستن پاپ‌آپ تبلیغات در صورت وجود
                  try:
                      cancel_btn = page.locator('button:has-text("Cancel"), button:has-text("Close"), #upgradeBackBtn').first
                      if cancel_btn.is_visible():
                          cancel_btn.click(force=True, timeout=5000)
                          time.sleep(2)
                  except: pass

                  # 🎛️ بخش اصلاح‌شده و بسیار قدرتمند کلیک روی دکمه‌های سرور
                  try:
                      target_selector = ""
                      if action == 'start':
                          target_selector = "button#startbutton, button:has-text('Start')"
                      elif action == 'stop':
                          target_selector = "button#stopbutton, button:has-text('Stop')"
                      elif action == 'restart':
                          target_selector = "button#restartbutton, button:has-text('Restart')"

                      if target_selector:
                          # ۱. پیدا کردن دکمه و اسکرول کردن به سمت آن تا در دید مرورگر قرار گیرد
                          btn_element = page.locator(target_selector).first
                          btn_element.scroll_into_view_if_needed()
                          time.sleep(2)
                          
                          # ۲. فوکوس روی دکمه برای تحریک کارهای جاوااسکریپتی صفحه
                          btn_element.focus()
                          time.sleep(1)
                          
                          # ۳. کلیک ترکیبی (هم معمولی و هم کلیک سخت‌افزاری با متدdispatchEvent)
                          btn_element.click(force=True, timeout=10000)
                          page.evaluate(f"document.querySelector('{target_selector.split(',')[0]}').click()")
                          
                          print(f"Successfully triggered click on {action}")
                      time.sleep(5)
                  except Exception as e:
                      send_or_edit_telegram(f"❌ خطا در فشردن دکمه سرور: {e}")

                  # 📋 استخراج زنده لاگ و وضعیت سخت‌افزار
                  if action == 'logs' or action in ['start', 'restart']:
                      stop_keyboard = {"inline_keyboard": [[{"text": "🛑 پایان نمایش کنسول", "callback_data": "stop_current_stream"}]]}
                      send_to_others(f"🚀 **سرور با موفقیت استارت شد!**\nعملیات دکمه **[{action_fa}]** پایان یافت و سرور ماینکرافت در حال بالا آمدن است.")

                      for _ in range(50):
                          try:
                              check_stop = requests.post(f"{APP_URL}/stop_log", json={"chat_id": sender_chat_id}).json()
                              if check_stop.get("stop", False):
                                  send_or_edit_telegram("⏹️ پخش زنده کنسول به دستور شما کاملاً متوقف شد.")
                                  break
                          except: pass
                          
                          try:
                              page_text = page.locator('body').inner_text()
                              
                              ram_matches = re.findall(r'([0-9.]+)\s*GB', page_text)
                              mem_text = "نامشخص"
                              for match in ram_matches:
                                  if match != "2.5":
                                      mem_text = f"{match} GB"
                                      break
                              
                              cpu_matches = re.findall(r'([0-9.]+)\s*%', page_text)
                              cpu_text = f"{cpu_matches[0]}%" if cpu_matches else "نامشخص"
                              
                              raw_logs = page.locator('.console-container, #console, pre, .terminal').inner_text()
                              if "================================================================================" in raw_logs:
                                  clean_logs = raw_logs.split("================================================================================")[-1]
                              else:
                                  clean_logs = raw_logs
                              
                              current_chunk = clean_logs[-1200:].strip()
                              
                              full_message = (
                                  f"📊 **وضعیت منابع سیستم:**\n"
                                  f"🔹 پردازنده: `{cpu_text}` | 🔸 رم: `{mem_text}`\n"
                                  f"━━━━━━━━━━━━━━━━━━━━\n"
                                  f"📝 **لاین‌های پایانی کنسول سرور:**\n"
                                  f"```text\n{current_chunk}\n```"
                              )
                              
                              send_or_edit_telegram(full_message, stop_keyboard)
                              
                          except Exception as e:
                              print(f"Log loop error: {e}")
                          
                          time.sleep(4)
                  else:
                      send_or_edit_telegram(f"✅ دستور **{action.upper()}** با موفقیت به سرور ارسال شد.")
                      send_to_others(f"🛑 **اعلان پنل سرور:**\nسرور ماینکرافت توسط دوستت خاموش شد.")
              else:
                  send_or_edit_telegram("❌ فایل `cookies.json` یافت نشد.")
              
              browser.close()
          EOF
          python script.py
