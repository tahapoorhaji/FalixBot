name: Falix Control Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (start, stop, restart, logs)'
        required: true
        default: 'start'
      chat_id:
        description: 'Telegram User Chat ID'
        required: true

jobs:
  control-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run Automation Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          SERVER_ACTION: ${{ github.event.inputs.action }}
        run: |
          cat << 'EOF' > script.py
          import os
          import time
          import json
          import requests
          from playwright.sync_api import sync_playwright

          bot_token = os.getenv('BOT_TOKEN')
          chat_id = os.getenv('CHAT_ID')
          action = os.getenv('SERVER_ACTION')
          APP_URL = "https://نام-اپلیکیشن-شما-در-هاست.com" # آدرس دقیق هاست رندر یا کویب شما

          live_msg_id = None

          def send_or_edit_telegram(text, keyboard=None):
              global live_msg_id
              if live_msg_id is None:
                  url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
                  payload = {"chat_id": chat_id, "text": text, "parse_mode": "Markdown"}
                  if keyboard: payload["reply_markup"] = json.dumps(keyboard)
                  try:
                      res = requests.post(url, json=payload).json()
                      if res.get("ok"): live_msg_id = res["result"]["message_id"]
                  except: pass
              else:
                  url = f"https://api.telegram.org/bot{bot_token}/editMessageText"
                  payload = {"chat_id": chat_id, "message_id": live_msg_id, "text": text, "parse_mode": "Markdown"}
                  if keyboard: payload["reply_markup"] = json.dumps(keyboard)
                  try: requests.post(url, json=payload)
                  except: pass

          with sync_playwright() as p:
              send_or_edit_telegram("🤖 **[مرحله ۱/۲]** در حال آماده‌سازی مرورگر ابری و ورود به پنل...")
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  viewport={"width": 1280, "height": 720}
              )
              
              if os.path.exists('cookies.json'):
                  with open('cookies.json', 'r') as f:
                      cookies = json.load(f)
                      formatted_cookies = []
                      for cookie in cookies:
                          if 'sameSite' in cookie:
                              s_site = str(cookie['sameSite']).capitalize()
                              if s_site in ['Strict', 'Lax', 'None']: cookie['sameSite'] = s_site
                              else: cookie['sameSite'] = 'None'
                          if 'id' in cookie: del cookie['id']
                          formatted_cookies.append(cookie)
                      context.add_cookies(formatted_cookies)
                  
                  page = context.new_page()
                  send_or_edit_telegram("🔗 **[مرحله ۲/۲]** ورود با کوکی موفقیت‌آمیز بود. بارگذاری صفحه اصلی کنسول...")
                  
                  # 🛠️ تغییر اصلاحی کلیدی: تغییر به commit برای دور زدن لود بی‌پایان تبلیغات شبکه
                  page.goto('https://client.falixnodes.net/server/3241406/console', wait_until="commit")
                  time.sleep(15) # زمان کافی برای رندر شدن المان‌های اصلی دکمه و ترمینال
                  
                  # 🎯 تلاش برای بستن پاپ‌آپ تبلیغات در صورت وجود
                  try:
                      cancel_btn = page.locator('button:has-text("Cancel"), button:has-text("Close"), #upgradeBackBtn').first
                      if cancel_btn.is_visible():
                          cancel_btn.click(force=True)
                          send_or_edit_telegram("🎯 پاپ‌آپ تبلیغات/حمایت مالی با موفقیت کلیک و بسته شد.")
                          time.sleep(2)
                  except: pass

                  # 📊 استخراج زنده وضعیت منابع سیستم
                  cpu_text, mem_text = "نامشخص", "نامشخص"
                  try:
                      cpu_text = page.locator('div:has(> span:has-text("CPU")), tr:has-text("CPU")').inner_text().replace("CPU", "").strip().split('\n')[0]
                      mem_text = page.locator('div:has(> span:has-text("Memory")), tr:has-text("Memory")').inner_text().replace("Memory", "").strip().split('\n')[0]
                  except: pass

                  # 🎛️ اجرای دکمه‌ها
                  try:
                      if action == 'start':
                          send_or_edit_telegram("🟢 در حال فشردن دکمه استارت...")
                          page.locator('button#startbutton').click(force=True)
                      elif action == 'stop':
                          send_or_edit_telegram("🔴 در حال فشردن دکمه خاموش...")
                          page.locator('button#stopbutton').click(force=True)
                      elif action == 'restart':
                          send_or_edit_telegram("🔄 در حال فشردن دکمه ری‌استارت...")
                          page.locator('button#restartbutton').click(force=True)
                      time.sleep(3)
                  except Exception as e:
                      send_or_edit_telegram(f"❌ خطا در فشردن دکمه: {e}")

                  # 📋 استخراج زنده لاگ مستقیم از داخل خود صفحه
                  if action == 'logs' or action in ['start', 'restart']:
                      last_log_chunk = ""
                      stop_keyboard = {"inline_keyboard": [[{"text": "🛑 پایان نمایش کنسول", "callback_data": "stop_current_stream"}]]}
                      
                      for _ in range(40):
                          try:
                              check_stop = requests.post(f"{APP_URL}/stop_log", json={"chat_id": chat_id}).json()
                              if check_stop.get("stop", False):
                                  send_or_edit_telegram("⏹️ نمایش زنده لاگ سرور متوقف شد.")
                                  break
                          except: pass
                          
                          try:
                              raw_logs = page.locator('.console-container, #console, pre, .terminal').inner_text()
                              
                              if "================================================================================" in raw_logs:
                                  clean_logs = raw_logs.split("================================================================================")[-1]
                              else:
                                  clean_logs = raw_logs
                              
                              current_chunk = clean_logs[-1200:].strip()
                              
                              full_message = (
                                  f"📊 **وضعیت منابع سیستم:**\n"
                                  f"🔹 پردازنده: `{cpu_text}` | 🔸 رم: `{mem_text}`\n"
                                  f"━━━━━━━━━━━━━━━━━━━━\n"
                                  f"📝 **لاین‌های پایانی کنسول سرور:**\n"
                                  f"```text\n{current_chunk}\n```"
                              )
                              
                              if current_chunk != last_log_chunk and len(current_chunk) > 5:
                                  send_or_edit_telegram(full_message, stop_keyboard)
                                  last_log_chunk = current_chunk
                          except: pass
                          
                          time.sleep(4)
                  else:
                      send_or_edit_telegram(f"✅ دستور **{action.upper()}** با موفقیت به سرور ارسال شد.\n🔹 CPU: `{cpu_text}`\n🔸 Memory: `{mem_text}`")
              else:
                  send_or_edit_telegram("❌ فایل `cookies.json` یافت نشد.")
              
              browser.close()
          EOF
          python script.py
