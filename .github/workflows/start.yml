name: Falix Control Bot

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (start or stop)'
        required: true
        default: 'start'

jobs:
  control-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Automation Script
        env:
          FALIX_EMAIL: ${{ secrets.FALIX_EMAIL }}
          FALIX_PASSWORD: ${{ secrets.FALIX_PASSWORD }}
          SERVER_ACTION: ${{ github.event.inputs.action }}
        run: |
          cat << 'EOF' > script.py
          import os
          import time
          import json
          from playwright.sync_api import sync_playwright

          email = os.getenv('FALIX_EMAIL')
          password = os.getenv('FALIX_PASSWORD')
          action = os.getenv('SERVER_ACTION')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              
              # شبیه‌سازی دقیق یک مرورگر واقعی برای امنیت بیشتر
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  viewport={"width": 1280, "height": 720}
              )
              
              # بررسی وجود فایل کوکی برای دور زدن کپچا و لاگین
              if os.path.exists('cookies.json'):
                  print("🍪 Found cookies.json! Formatting cookies...")
                  with open('cookies.json', 'r') as f:
                      cookies = json.load(f)
                      
                      # اصلاح خودکار ساختار sameSite برای رفع ارور Playwright
                      formatted_cookies = []
                      for cookie in cookies:
                          # تبدیل مقادیر غیر استاندارد به None یا حذف آنها
                          if 'sameSite' in cookie:
                              s_site = str(cookie['sameSite']).capitalize()
                              if s_site in ['Strict', 'Lax', 'None']:
                                  cookie['sameSite'] = s_site
                              else:
                                  cookie['sameSite'] = 'None' # مقدار امن پیش‌فرض
                          
                          # حذف فیلد id در صورت وجود (چون گاهی ارور ایجاد می‌کند)
                          if 'id' in cookie:
                              del cookie['id']
                              
                          formatted_cookies.append(cookie)
                          
                      context.add_cookies(formatted_cookies)
                  
                  page = context.new_page()
                  print("🔗 Going straight to Minecraft Server Console...")
                  page.goto('https://client.falixnodes.net/server/3241406/console', wait_until="networkidle")
                  time.sleep(5)
              else:
                  print("⚠️ No cookies.json found. Falling back to manual login...")
                  page = context.new_page()
                  page.goto('https://client.falixnodes.net/login', wait_until="networkidle")
                  time.sleep(5)
                  
                  print("🔑 Filling login details...")
                  page.fill('input[name="email"], input[type="email"]', email)
                  page.fill('input[name="password"], input[type="password"]', password)
                  
                  print("🔑 Submitting login form...")
                  page.locator('button[type="submit"]').click()
                  time.sleep(8)
                  
                  print("🔗 Moving to Minecraft Server Console...")
                  page.goto('https://client.falixnodes.net/server/3241406/console', wait_until="networkidle")
                  time.sleep(5)

              # بررسی وضعیت نهایی و زدن دکمه‌ها
              try:
                  page.screenshot(path="console_page.png")
                  
                  if action == 'start':
                      print("🟢 Clicking START Button...")
                      page.locator('button:has-text("Start")').click()
                  elif action == 'stop':
                      print("🔴 Clicking STOP Button...")
                      page.locator('button:has-text("Stop")').click()
                      
                  time.sleep(5)
                  print("✅ Process Finished Successfully!")
                  
              except Exception as e:
                  print(f"❌ Error occurred during action: {e}")
                  page.screenshot(path="error_page.png")
                  raise e
              finally:
                  browser.close()
          EOF
          python script.py

      - name: Upload Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: falix-screenshots
          path: "*.png"
