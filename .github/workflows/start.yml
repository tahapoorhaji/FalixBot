name: Falix Control Bot

concurrency:
  group: falix-control
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action (start, stop, restart, logs)'
        required: true
        default: 'start'
      chat_id:
        description: 'Telegram User Chat ID'
        required: true

jobs:
  control-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Run Automation Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          SERVER_ACTION: ${{ github.event.inputs.action }}
        run: |
          cat << 'EOF' > script.py
          import os
          import time
          import json
          import re
          import requests
          from playwright.sync_api import sync_playwright

          bot_token = os.getenv('BOT_TOKEN')
          sender_chat_id = str(os.getenv('CHAT_ID')).strip()
          action = os.getenv('SERVER_ACTION')
          APP_URL = "https://نام-اپلیکیشن-شما-در-هاست.com" # آدرس دقیق هاست رندر یا کویب شما

          # 👥 آیدی خودت و دوستت رو اینجا دقیقاً داخل کوتیشن بنویس (مثال: "1111" و "2222")
          USER_1 = "5213388626"
          USER_2 = "1975142727"
          TOTAL_USERS = {USER_1, USER_2}

          live_msg_id = None

          def send_to_others(text):
              others = TOTAL_USERS - {sender_chat_id}
              for uid in others:
                  if uid:
                      url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
                      payload = {"chat_id": uid, "text": text, "parse_mode": "Markdown"}
                      try: requests.post(url, json=payload)
                      except: pass

          def send_or_edit_telegram(text, keyboard=None):
              global live_msg_id
              if live_msg_id is None:
                  url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
                  payload = {"chat_id": sender_chat_id, "text": text, "parse_mode": "Markdown"}
                  if keyboard: payload["reply_markup"] = json.dumps(keyboard)
                  try:
                      res = requests.post(url, json=payload).json()
                      if res.get("ok"): live_msg_id = res["result"]["message_id"]
                  except: pass
              else:
                  url = f"https://api.telegram.org/bot{bot_token}/editMessageText"
                  payload = {"chat_id": sender_chat_id, "message_id": live_msg_id, "text": text, "parse_mode": "Markdown"}
                  if keyboard: payload["reply_markup"] = json.dumps(keyboard)
                  try: requests.post(url, json=payload)
                  except: pass

          def click_button_native(page, btn_action):
              btn_id = f"{btn_action}button"
              try:
                  page.locator(f"button#{btn_id}").first.scroll_into_view_if_needed()
                  page.locator(f"button#{btn_id}").first.focus()
                  time.sleep(1)
                  page.evaluate(f"""
                      () => {{
                          const btn = document.getElementById('{btn_id}');
                          if (btn) {{
                              btn.removeAttribute('disabled');
                              btn.dispatchEvent(new MouseEvent('click', {{ bubbles: true, cancelable: true, view: window }}));
                              btn.click();
                          }}
                      }}
                  """)
                  print(f"Executed native click on: {btn_id}")
              except Exception as e:
                  print(f"Error clicking {btn_id}: {e}")

          action_fa = {"start": "روشن کردن", "stop": "خاموش کردن", "restart": "ری‌استارت", "logs": "دریافت لاگ"}.get(action, action)
          send_to_others(f"📢 **اعلان پنل سرور:**\n👤 دوستت سرور را روی وضعیت **[{action_fa}]** گذاشت.\n⏳ ربات در حال حاضر مشغول است، لطفا دکمه دیگری نزنید.")

          with sync_playwright() as p:
              send_or_edit_telegram("🤖 **[مرحله ۱/۲]** در حال آماده‌سازی مرورگر ابری...")
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  viewport={"width": 1280, "height": 720}
              )
              
              if os.path.exists('cookies.json'):
                  with open('cookies.json', 'r') as f:
                      cookies = json.load(f)
                      formatted_cookies = []
                      for cookie in cookies:
                          if 'sameSite' in cookie:
                              s_site = str(cookie['sameSite']).capitalize()
                              if s_site in ['Strict', 'Lax', 'None']: cookie['sameSite'] = s_site
                              else: cookie['sameSite'] = 'None'
                          if 'id' in cookie: del cookie['id']
                          formatted_cookies.append(cookie)
                      context.add_cookies(formatted_cookies)
                  
                  page = context.new_page()
                  send_or_edit_telegram("🔗 **[مرحله ۲/۲]** ورود موفقیت‌آمیز بود. در حال پایدارسازی اتصال به کنسول...")
                  
                  # باز کردن مستقیم صفحه با متد پایداری بالا
                  page.goto('https://client.falixnodes.net/server/3241406/console', wait_until="commit")
                  time.sleep(22)
                  
                  try:
                      cancel_btn = page.locator('button:has-text("Cancel"), button:has-text("Close"), #upgradeBackBtn').first
                      if cancel_btn.is_visible():
                          cancel_btn.click(force=True, timeout=5000)
                          time.sleep(2)
                  except: pass

                  if action in ['start', 'stop', 'restart']:
                      click_button_native(page, action)
                      time.sleep(5)

                  if action == 'logs' or action in ['start', 'restart']:
                      stop_keyboard = {"inline_keyboard": [[{"text": "🛑 پایان نمایش کنسول", "callback_data": "stop_current_stream"}]]}
                      send_to_others(f"🚀 **دستور اولیه [{action_fa}] ارسال شد.**\nربات در حال مانیتورینگ وضعیت کنسول است...")

                      first_morning_check = True

                      for loop_step in range(60):
                          try:
                              check_stop = requests.post(f"{APP_URL}/stop_log", json={"chat_id": sender_chat_id}).json()
                              if check_stop.get("stop", False):
                                  send_or_edit_telegram("⏹️ پخش زنده کنسول به دستور شما کاملاً متوقف شد.")
                                  break
                          except: pass
                          
                          try:
                              page_text = page.locator('body').inner_text()
                              ram_matches = re.findall(r'([0-9.]+)\s*GB', page_text)
                              mem_text = "نامشخص"
                              for match in ram_matches:
                                  if match != "2.5":
                                      mem_text = f"{match} GB"
                                      break
                              
                              cpu_matches = re.findall(r'([0-9.]+)\s*%', page_text)
                              cpu_text = f"{cpu_matches[0]}%" if cpu_matches else "نامشخص"
                              
                              raw_logs = page.locator('.console-container, #console, pre, .terminal').inner_text()
                              if "================================================================================" in raw_logs:
                                  clean_logs = raw_logs.split("================================================================================")[-1]
                              else:
                                  clean_logs = raw_logs
                              
                              current_chunk = clean_logs[-1200:].strip()

                              if action == 'start' and first_morning_check and len(current_chunk) < 15:
                                  first_morning_check = False
                                  
                                  queue_msg = "⏳ **سرور امروز برای اولین بار روشن می‌شود و در صف فالیکس قرار دارد...**\n⚙️ ربات برای خروج از صف ۳ دقیقه منتظر می‌ماند و سپس استارت نهایی را می‌زند. لطفا صبور باشید."
                                  send_or_edit_telegram(queue_msg)
                                  send_to_others("⏳ سرور در صف بیدارباش فالیکس است. ربات ۳ دقیقه دیگر استارت نهایی را می‌زند.")
                                  
                                  time.sleep(180) 
                                  
                                  click_button_native(page, 'start')
                                  time.sleep(5)
                                  continue

                              full_message = (
                                  f"📊 **وضعیت منابع سیستم:**\n"
                                  f"🔹 پردازنده: `{cpu_text}` | 🔸 رم: `{mem_text}`\n"
                                  f"━━━━━━━━━━━━━━━━━━━━\n"
                                  f"📝 **لاین‌های پایانی کنسول سرور:**\n"
                                  f"```text\n{current_chunk if current_chunk else 'کنسول در انتظار دریافت اطلاعات...'}\n```"
                              )
                              
                              send_or_edit_telegram(full_message, stop_keyboard)
                              
                          except Exception as e:
                              print(f"Log loop error: {e}")
                          
                          time.sleep(4)
                  else:
                      send_or_edit_telegram(f"✅ دستور **{action.upper()}** با موفقیت به سرور ارسال شد.")
                      send_to_others(f"🛑 **اعلان پنل سرور:**\nسرور ماینکرافت توسط دوستت خاموش شد.")
              else:
                  send_or_edit_telegram("❌ فایل `cookies.json` یافت نشد.")
              
              browser.close()
          EOF
          python script.py
